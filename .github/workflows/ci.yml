name: CI
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java:
          - 17
          - 25
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: ${{matrix.java}}
        distribution: zulu
    - uses: sbt/setup-sbt@v1
    - uses: coursier/cache-action@v9
    - shell: bash
      run: sbt -v
           --server
           "+ scalafmtCheckAll"
           scalafmtSbtCheck
           "+ testFull"
    - uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
      if: always()
      with:
        report_paths: 'target/**/test-reports/*.xml'
        require_tests: true
        check_name: "${{ matrix.java }}"
